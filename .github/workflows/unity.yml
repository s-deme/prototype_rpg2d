name: Unity validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-tests:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release inputs
        shell: pwsh
        run: ./scripts/Test-ReleasePreflight.ps1
      - name: Run Unity editor tests
        id: editor-tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          testMode: EditMode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: Alice-RPG-EditMode-Test-Results
          path: ${{ steps.editor-tests.outputs.artifactsPath }}
          if-no-files-found: warn

  windows-build:
    needs: editor-tests
    runs-on: ubuntu-latest
    steps:
      # Build the tested commit in a fresh workspace, without test-generated files.
      - name: Check out tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Windows player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          targetPlatform: StandaloneWindows64
          buildMethod: AliceRpgBuild.BuildWindows
      - name: Package Windows release
        shell: pwsh
        run: ./scripts/Package-WindowsRelease.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: Alice-and-the-Broken-Crown-Windows
          path: Releases
